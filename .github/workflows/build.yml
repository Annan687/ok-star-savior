name: Build OKSS installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: okss-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release source
        run: python tools/release_check.py --repository '${{ github.repository }}'
      - name: Install and verify runtime
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python main.py --check
          python tools/release_check.py --smoke
      - name: Build online and bundled installers
        uses: ok-oldking/pyappify-action@c5cc8fe5c9bd5c732969018694a2645474c48b7e
        with:
          version: 'v1.2.3'
      - name: Verify installers and write checksums
        shell: pwsh
        run: |
          $expectedInstallers = @('ok-star-savior-win32-Global-setup.exe', 'ok-star-savior-win32-online-setup.exe')
          foreach ($installer in $expectedInstallers) {
            if (!(Test-Path -LiteralPath "pyappify_dist/$installer")) { throw "Missing installer: $installer" }
          }
          Get-ChildItem -LiteralPath pyappify_dist -File |
            Where-Object Extension -in '.exe', '.zip' |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -LiteralPath pyappify_dist/SHA256SUMS.txt -Encoding utf8
      - name: Save installers for review
        uses: actions/upload-artifact@v4
        with:
          name: ok-star-savior-installers-${{ github.ref_name }}
          path: pyappify_dist/*
          if-no-files-found: error
          retention-days: 14
